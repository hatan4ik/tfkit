name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release Assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true

      - name: Build multi-arch binaries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          PLATFORMS=(
            "darwin/arm64"
            "darwin/amd64"
            "linux/arm64"
            "linux/amd64"
            "windows/amd64"
          )

          for platform in "${PLATFORMS[@]}"; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then
              EXT=".exe"
            fi

            BIN_NAME="tfkit${EXT}"
            ARCHIVE_NAME="tfkit_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
            if [ "$GOOS" = "windows" ]; then
              ARCHIVE_NAME="tfkit_${VERSION}_${GOOS}_${GOARCH}.zip"
            fi

            echo "Building $GOOS/$GOARCH..."
            BUILD_DIR="build_${GOOS}_${GOARCH}"
            mkdir -p "$BUILD_DIR"
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath \
              -ldflags="-s -w -X github.com/hatan4ik/tfkit/internal/cli.Version=${VERSION}" \
              -o "$BUILD_DIR/$BIN_NAME" ./cmd/tfkit

            cp LICENSE README.md "$BUILD_DIR/"

            if [ "$GOOS" = "windows" ]; then
              (cd "$BUILD_DIR" && zip -q "../dist/$ARCHIVE_NAME" "$BIN_NAME" LICENSE README.md)
            else
              tar -czf "dist/$ARCHIVE_NAME" -C "$BUILD_DIR" "$BIN_NAME" LICENSE README.md
            fi

            rm -rf "$BUILD_DIR"
          done

          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Release $GITHUB_REF_NAME" \
            --generate-notes

